[project]
name = "findex"
version = "1.0.0"
description = "Статистика текстового корпусу для навчальної пошукової системи"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "rich>=15.0.0",
    "typer>=0.19",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
]

[project.scripts]
findex = "findex.cli:app"

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = ["slow: розширені перевірки з генерацією даних"]
