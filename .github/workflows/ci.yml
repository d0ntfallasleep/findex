name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=findex
      - run: uv build --wheel
      - run: uv tool install dist/*.whl && cd /tmp && "$(uv tool dir --bin)/findex" --help
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/tags/v1.0.0'
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/*.whl --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 dist/*.whl --verify-tag -R "$GITHUB_REPOSITORY" --title "findex 1.0.0" --notes "CLI: index, search, stats"
          fi
